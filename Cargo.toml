[package]
name = "cpyref"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Copy exact bytes once and paste them by a short reference, for AI agents"
license-file = "LICENSE"
homepage = "https://github.com/LIghtJUNction/cpyref"
repository = "https://github.com/LIghtJUNction/cpyref"
readme = "README.md"
keywords = ["cli", "clipboard", "ai", "agents", "copy"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "tests/*.rs", "docs/**", "skills/**", "examples/**", "Cargo.toml", "Cargo.lock", "LICENSE", "LICENSE.MIT", "AGENTS.md", "UPSTREAM.toml", "README.md"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
rand = "0.8"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.23"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
