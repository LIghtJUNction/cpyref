name: Finalize safety fixes

on:
  push:
    branches: [feat/safe-edit-run-limits]
    paths: [.github/workflows/sync-hardening.yml]

permissions:
  contents: write

concurrency:
  group: reconcile-cpyref-hardening
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/feat/safe-edit-run-limits'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve inspected 0.2.2 updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          MAIN=7c20b63b0724663803e8cf7efdbcaf63c686de5a
          git fetch --no-tags origin "$MAIN"
          set +e
          git merge --no-commit --no-ff "$MAIN"
          RESULT=$?
          set -e
          test "$RESULT" -le 1
          # Only the independently advanced development version may conflict.
          python3 - <<'PY'
          import subprocess
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          if set(conflicts) - {'Cargo.toml', 'Cargo.lock'}:
              raise SystemExit(f'Unexpected concurrent changes: {conflicts}')
          for path in conflicts:
              subprocess.run(['git', 'checkout', '--ours', '--', path], check=True)
              subprocess.run(['git', 'add', path], check=True)
          PY
      - name: Fix compatibility and strengthen regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runner.rs')
          text = p.read_text()
          start = text.index('fn reserve(')
          end = text.index('\nfn capture(', start)
          text = text[:start] + '''fn reserve(counter: &AtomicU64, cap: u64, requested: usize) -> usize {
              let mut used = counter.load(Ordering::SeqCst);
              loop {
                  let allowed = cap.saturating_sub(used).min(requested as u64);
                  match counter.compare_exchange(used, used + allowed, Ordering::SeqCst, Ordering::SeqCst) {
                      Ok(_) => return allowed as usize,
                      Err(current) => used = current,
                  }
              }
          }
          ''' + text[end:]
          assert 'Re-read only after both completions' in text, 'Expected the newer main EOF/guard fix'
          p.write_text(text)
          for name in ('README.md', 'docs/hardening.md'):
              p = Path(name)
              p.write_text(p.read_text().replace('0.2.1 主分支', '0.2.2 主分支'))
          p = Path('tests/test_hardening.py')
          text = p.read_text()
          anchor = '\n\nif __name__ == "__main__":'
          assert text.count(anchor) == 1
          additional = '''
              def test_redaction_expansion_is_limited_before_disk_write(self):
                  self.env["DEMO_SECRET"] = "x"
                  result = self.call("run", "--max-log-bytes", 16, "--redact-env", "DEMO_SECRET", "--", sys.executable,
                                     "-c", "import sys; sys.stdout.write('x'*8)")
                  self.assertEqual(result.returncode, 125, result.stderr)
                  report = json.loads(result.stdout)
                  self.assertEqual(report["termination_reason"], "log_limit")
                  self.assertFalse(report["logs_complete"])
                  self.assertLessEqual(report["stdout_bytes"] + report["stderr_bytes"], 16)

              def test_fast_finished_child_cannot_hide_limit(self):
                  for _ in range(10):
                      result = self.call("run", "--max-log-bytes", 64, "--", sys.executable,
                                         "-c", "import os; os.write(1,b'z'*65)")
                      self.assertEqual(result.returncode, 125, result.stderr)
                      report = json.loads(result.stdout)
                      self.assertEqual(report["termination_reason"], "log_limit")
                      self.assertFalse(report["logs_complete"])
          '''
          # Preserve four-space class indentation from the workflow literal.
          p.write_text(text.replace(anchor, '\n' + additional + anchor))
          PY
      - name: Format, lock and retain source changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          cargo metadata --format-version 1 > /dev/null
          cargo fmt --all
          python3 -m py_compile tests/test_hardening.py
          git add src tests/test_hardening.py Cargo.toml Cargo.lock README.md docs
          git commit -m 'fix: retain 0.2.2 guards and use portable atomic reservations'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:feat/safe-edit-run-limits
          unset AUTH GH_TOKEN
          git rev-parse HEAD
      - name: Verify final Linux behavior
        run: cargo fmt --all -- --check && cargo test --locked --all-targets && cargo clippy --locked --all-targets -- -D warnings && cargo build --locked && python3 -m unittest discover -s tests -p 'test_*.py' -v
