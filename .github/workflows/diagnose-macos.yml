name: Diagnose macOS capture

on:
  push:
    branches: [feat/safe-edit-run-limits]
    paths: [.github/workflows/diagnose-macos.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: cargo build --locked
      - name: Repeat bounded synthetic commands and sample stalls
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile, time
          binary = pathlib.Path('target/debug/cpyref').resolve()
          with tempfile.TemporaryDirectory(prefix='cpyref-diagnose-') as directory:
              root = pathlib.Path(directory).resolve()
              (root / '.git').mkdir()
              env = {k:v for k,v in os.environ.items() if not k.startswith('CPYREF_')}
              env.update(CPYREF_NO_CONFIG='true', CPYREF_STORE=str(root / 'store'))
              cases = [
                  ['--max-log-bytes','128','--',sys.executable,'-c',"import sys; sys.stdout.buffer.write(b'x'*128)"],
                  ['--timeout','1','--',sys.executable,'-c',"import time; print('started',flush=True); time.sleep(10)"],
                  ['--max-log-bytes','128','--','/bin/sh','-c',"printf '%0128d' 0"],
              ]
              for iteration in range(6):
                  for index, args in enumerate(cases):
                      out = root / f'out-{iteration}-{index}'
                      err = root / f'err-{iteration}-{index}'
                      start = time.monotonic()
                      with out.open('wb') as stdout, err.open('wb') as stderr:
                          process = subprocess.Popen([str(binary),'run',*args], cwd=root, env=env, stdout=stdout, stderr=stderr)
                          try:
                              code = process.wait(timeout=4)
                          except subprocess.TimeoutExpired:
                              print('STALL', iteration, index, 'pid', process.pid, flush=True)
                              sample = root / f'sample-{iteration}-{index}.txt'
                              subprocess.run(['/usr/bin/sample',str(process.pid),'1','1','-file',str(sample)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=10)
                              if sample.exists():
                                  text = sample.read_text(errors='replace')
                                  print(text[:18000], flush=True)
                              try:
                                  code = process.wait(timeout=12)
                              except subprocess.TimeoutExpired:
                                  process.kill()
                                  code = process.wait(timeout=5)
                      print(json.dumps({'iteration':iteration,'case':index,'exit':code,'seconds':time.monotonic()-start,
                                        'stdout':out.read_text(errors='replace')[:4000], 'stderr':err.read_text(errors='replace')[:4000]}), flush=True)
          PY
      - name: Repeat original regressions without changing their limits
        run: python3 -m unittest discover -s tests -p test_hardening.py -v
