name: Prepare and verify safety changes

on:
  push:
    branches: [feat/safe-edit-run-limits]
    paths: [.github/workflows/materialize-hardening.yml]

permissions:
  contents: write

concurrency:
  group: materialize-cpyref-hardening
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/safe-edit-run-limits'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Apply checked source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact edit anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          if 'pub mod edit;' in Path('src/lib.rs').read_text():
              raise SystemExit('Changes already materialized; do not apply twice')
          p = Path('src/lib.rs')
          p.write_text(p.read_text() + '\npub mod edit;\npub mod run_guard;\n')
          replace('Cargo.toml', 'version = "0.1.1"', 'version = "0.2.0"')
          replace('Cargo.toml', '[dependencies]\n', '[dependencies]\ncommand-group = "5.0"\n')
          replace('src/cli.rs', 'pub enum Command {\n', '''pub enum Command {
              /// Insert saved bytes at one explicit target position. Writing requires a target hash.
              Insert(Box<cpyref::edit::Args>),
              /// Replace a unique target selection with saved bytes. Writing requires a target hash.
              Replace(Box<cpyref::edit::Args>),
          ''')
          replace('src/cli.rs', 'pub struct RunArgs {\n', '''pub struct RunArgs {
              #[command(flatten)]
              pub limits: cpyref::run_guard::Limits,
          ''')
          replace('src/main.rs', '    match command {\n        Command::Copy(args) => {', '''    match command {
                  Command::Insert(args) => print_json(&cpyref::edit::execute(context, &args, false)?),
                  Command::Replace(args) => print_json(&cpyref::edit::execute(context, &args, true)?),
                  Command::Copy(args) => {''')
          replace('src/store.rs', '    pub fn put_with_options(\n', '''    pub(crate) fn edit_lock(&self) -> Result<File> {
                  self.prepare()?;
                  self.lock()
              }

              pub fn put_with_options(
          ''')
          replace('src/workflows.rs', '                inherit_stdin: args.inherit_stdin,', '                inherit_stdin: args.inherit_stdin,\n                limits: args.limits,')
          replace('src/runner.rs', 'pub struct RunOptions {\n', 'pub struct RunOptions {\n    pub limits: crate::run_guard::Limits,\n')
          replace('src/runner.rs', 'pub struct RunRecord {\n', '''pub struct RunRecord {
              #[serde(default)]
              pub stop_reason: Option<String>,
              #[serde(default)]
              pub redacted_env: Vec<String>,
          ''')
          replace('src/runner.rs', '    let store = context.store()?;', '    let protections = crate::run_guard::Prepared::new(&options.limits)?;\n    let store = context.store()?;')
          p = Path('src/runner.rs')
          text = p.read_text()
          start = text.index('    let mut child = command\n        .spawn()')
          end = text.index('    // Every failure after execution', start)
          text = text[:start] + '''    let captured = protections.capture(&mut command, stdout, stderr)?;
              let mut stdout = captured.stdout;
              let mut stderr = captured.stderr;
              let status = captured.status;
              let stop_reason = captured.stop_reason;
              let logs_complete = captured.logs_complete;
              let duration_ms = timer.elapsed().as_millis().min(u64::MAX as u128) as u64;
              let finished_at = stamp();
              let command_exit = status.code();
              #[cfg(unix)]
              let signal = {
                  use std::os::unix::process::ExitStatusExt;
                  status.signal()
              };
              #[cfg(not(unix))]
              let signal: Option<i32> = None;
              let wrapper_exit = match stop_reason.as_deref() {
                  Some("timeout") => 124,
                  Some("log_limit") => 125,
                  _ => command_exit.unwrap_or_else(|| signal.map_or(1, |s| 128 + s)).clamp(0, 255) as u8,
              };
          ''' + text[end:]
          p.write_text(text)
          replace('src/runner.rs', '        let analysis = analyze(\n', '        let mut analysis = analyze(\n')
          replace('src/runner.rs', '        let source_after = if let Some(manifest)', '''        if !logs_complete {
                      analysis.counts = None;
                      analysis.parse_status = "unknown".into();
                  }
                  let source_after = if let Some(manifest)''')
          replace('src/runner.rs', '            command: options.command.clone(),', '            command: protections.command(&options.command),\n            stop_reason: stop_reason.clone(),\n            redacted_env: protections.redacted_env.clone(),')
          replace('src/runner.rs', '            logs_complete: true,', '            logs_complete,')
          replace('src/runner.rs', '"stdout": preserve(stdout), "stderr": preserve(stderr), "logs_complete": true', '"stdout": preserve(stdout), "stderr": preserve(stderr), "logs_complete": logs_complete')
          replace('src/runner.rs', '        "analysis": record.analysis, "snapshot": record.snapshot, "source_after": source_after,', '        "analysis": record.analysis, "snapshot": record.snapshot, "source_after": source_after,\n        "stop_reason": record.stop_reason, "redacted_env": record.redacted_env,')
          replace('src/runner.rs', '    Ok(analyzer.finish(&run.record.analysis.parser, run.record.command_exit))', '''    let mut analysis = analyzer.finish(&run.record.analysis.parser, run.record.command_exit);
              if !run.record.logs_complete {
                  analysis.counts = None;
                  analysis.parse_status = "unknown".into();
              }
              Ok(analysis)''')
          replace('src/run_guard.rs', '''                    return Err(recovery("Could not inspect the recorded process.", stdout, stderr, None)
                                  .details(json!({"cause": error.to_string(), "logs_complete": false})));''', '''                    return Err(recovery(&format!("Could not inspect the recorded process: {error}"), stdout, stderr, None));''')
          replace('README.md', '## 安装\n', '''## 版本范围

          当前源码面向 0.2.0。已发布的 0.1.1 安装包不包含后续新增的清单、测试记录、局部写入和运行限制。
          未发布新版本前，从源码安装才能使用这些功能。参见[安全写入与运行限制](docs/hardening.md)。

          ## 安装
          ''')
          p = Path('docs/workflows.md')
          text = p.read_text()
          text = text.replace('没有隐式超时或后台任务管理。', '默认超时为 900 秒，stdout/stderr 共享 64 MiB 上限；超时和超限明确记录停止原因。详见 hardening.md。')
          text = text.replace('没有自动截断或磁盘容量配额。', '默认两路日志合计最多 64 MiB，达到上限会停止命令并标记日志不完整；这不是整个存储的磁盘配额。')
          text = text.replace('本轮不提供自动插入、替换或 patch，也不改变 paste --force 的整文件输出行为。', '局部插入和替换由 insert/replace 提供，要求明确目标哈希，见 hardening.md；paste --force 仍为整文件输出。')
          p.write_text(text)
          p = Path('skills/cpyref/SKILL.md')
          p.write_text(p.read_text() + '''\n## Safe edits and bounded runs (0.2.0 source)

          For an authorized local edit, use `insert` or `replace` with a complete bytes reference.
          First use `--dry-run`. Inspect the position and byte counts. Pass its `before_sha256`
          as `--expect-sha256` on the same operation. Never bypass TARGET_CHANGED or guess an
          occurrence to hide AMBIGUOUS. The tools do not add newlines or infer source-language syntax.

          `run` defaults to a 900-second command/pipe deadline and a combined 64 MiB stdout/stderr
          budget. Set `--timeout` and `--max-log-bytes` deliberately; zero disables that limit.
          Exit 124 means the deadline stopped capture; 125 means the byte budget stopped capture.
          Check stop_reason, logs_complete and command_exit separately. Do not retry commands
          with side effects merely because they stopped or their record could not be saved.

          `--redact-env NAME` removes the exact environment value from captured logs and stored
          argv before disk writes. It does not discover secrets, encrypt records or remove values
          from the child's environment. Encoded values, source paths and other child files are
          not protected. The resulting streams are redacted records, not byte-exact original logs.
          See docs/hardening.md for guarantees and limits.
          ''')
          print('Source edits applied with exact-anchor checks.')
          PY
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt && rustup default stable
      - name: Resolve only needed dependencies and format sources
        run: cargo metadata --format-version 1 > /dev/null && cargo fmt --all
      - name: Save the materialized source to the work branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add src Cargo.toml Cargo.lock README.md docs skills
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: wire guarded edits and bounded runs for 0.2.0'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:feat/safe-edit-run-limits
          unset AUTH GH_TOKEN
          git rev-parse HEAD
      - name: Test Rust changes
        run: cargo test --locked --all-targets
      - name: Check warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build CLI and run cross-platform regression suite
        run: cargo build --locked && python3 -m unittest discover -s tests -p 'test_*.py' -v
