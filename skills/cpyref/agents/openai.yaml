interface:
  display_name: "CpyRef"
  short_description: "Hand off notes and files; retrieve only needed bytes"
  default_prompt: "Use $cpyref (the executable is cpyref, also when I say cpy) to hand off notes and key files in one step. Forward its short retrieval prompt; list the package and read only needed excerpts. Preserve exact bytes and project context. References require same-machine access and contain historical snapshots."

policy:
  allow_implicit_invocation: true
